# v で始まるタグ（例: v2.0.0）を push すると，Windows で exe を作ってリリースに添付する
name: Build exe and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GakumasRehearsalTool
          path: src-tauri/target/release/GakumasRehearsalTool.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/GakumasRehearsalTool.exe
          generate_release_notes: true
